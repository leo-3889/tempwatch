name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4        # zizmor: ignore[unpinned-uses]

      - name: Tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-3.0
          python3 test_tempwatch.py

      - name: Build .deb
        run: bash packaging/build_deb.sh "${GITHUB_REF_NAME#v}"

      - name: Source tarball
        run: |
          mkdir -p dist
          git archive --prefix="tempwatch-${GITHUB_REF_NAME#v}/" \
            -o "dist/tempwatch_${GITHUB_REF_NAME#v}.orig.tar.gz" HEAD

      - name: Smoke test the package
        run: |
          sudo apt install -y ./dist/tempwatch_*_all.deb
          python3 - <<'EOF'
          import ast
          ast.parse(open("/usr/share/tempwatch/tempwatch-app.py").read())
          EOF
          command -v tempwatch tempwatch-tui
          test -x /usr/bin/tempwatch && test -x /usr/bin/tempwatch-tui
          dpkg -l tempwatch | tail -1

      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2   # zizmor: ignore[unpinned-uses]
        with:
          files: dist/*
          generate_release_notes: true
